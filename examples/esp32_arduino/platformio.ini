; PlatformIO Project Configuration for ESP32-P4C5-CAM ESP32 Arduino Examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = 01_hand_gesture
; PlatformIO only compiles .ino sketches located directly in src_dir.
; Update src_dir below to build another example (01_hand_gesture .. 11_line_track).
src_dir = ESP32_P4C5_CAM/examples/01_hand_gesture

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_extra_dirs =
    .
build_flags =
    -D CORE_DEBUG_LEVEL=0

[env:01_hand_gesture]
