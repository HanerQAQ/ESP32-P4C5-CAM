; PlatformIO Project Configuration for ESP32-P4C5-CAM ESP32 Arduino Examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = 01_hand_gesture
src_dir = ESP32_P4C5_CAM/examples

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -D CORE_DEBUG_LEVEL=0
    -I ESP32_P4C5_CAM/src
lib_extra_dirs =
    ESP32_P4C5_CAM

[env:01_hand_gesture]
build_src_filter = +<01_hand_gesture/*.ino>

[env:02_cat_detect]
build_src_filter = +<02_cat_detect/*.ino>

[env:03_dog_detect]
build_src_filter = +<03_dog_detect/*.ino>

[env:04_pedestrian]
build_src_filter = +<04_pedestrian/*.ino>

[env:05_yolo11n]
build_src_filter = +<05_yolo11n/*.ino>

[env:06_face_detect]
build_src_filter = +<06_face_detect/*.ino>

[env:07_pose_detect]
build_src_filter = +<07_pose_detect/*.ino>

[env:08_apriltag]
build_src_filter = +<08_apriltag/*.ino>

[env:09_qrcode]
build_src_filter = +<09_qrcode/*.ino>

[env:10_color_detect]
build_src_filter = +<10_color_detect/*.ino>

[env:11_line_track]
build_src_filter = +<11_line_track/*.ino>
